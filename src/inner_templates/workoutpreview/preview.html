<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Workout Preview</title>
    <script src="../i18n/i18n.js"></script>
    <script>
        // Modern look of the app: TrainingProgramsListJS.qml passes the theme colours in the
        // fragment (#modern=1&dark=1&bg=...) and later calls qzApplyTheme() when the theme
        // changes. Without the fragment the page keeps its own palette. The chart takes the
        // theme through qzcharttheme.js.
        window.qzApplyTheme = function (theme) {
            var root = document.documentElement;
            var vars = { bg: '--qz-bg', surface: '--qz-surface', text: '--qz-text', muted: '--qz-muted' };
            for (var key in vars) {
                if (theme[key]) {
                    root.style.setProperty(vars[key], theme[key]);
                }
            }
            root.classList.add('modern');
            root.classList.toggle('light', !theme.dark);
            root.style.colorScheme = theme.dark ? 'dark' : 'light';
            if (window.qzChartTheme) {
                window.qzChartTheme.refresh();
            }
        };
        (function () {
            var theme = {};
            window.location.hash.substring(1).split('&').forEach(function (pair) {
                var i = pair.indexOf('=');
                if (i > 0) {
                    theme[pair.substring(0, i)] = decodeURIComponent(pair.substring(i + 1));
                }
            });
            if (theme.modern === '1') {
                theme.dark = theme.dark === '1';
                window.qzApplyTheme(theme);
            }
        })();
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1d2330;
            color: white;
            padding: 10px;
        }

        /* The charts fill the view (the body padding off): a fixed 400px did not fit the view
           held sideways - the time axis was cut and the page scrolled - and left a gap upright.
           One metric takes the whole height; several share it, each chart no lower than 140px
           (qzmetriccharts.js), and the page scrolls when they do not fit */
        #chart-container {
            width: 100%;
            min-height: calc(100vh - 20px);
            background: white;
            color: #333;
            border-radius: 8px;
            padding: 10px;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
        }

        /* Modern look: the page in the app theme, the chart on a rounder card (white in the
           light theme, the surface colour in the dark one) */
        html.modern body {
            background: var(--qz-bg);
            color: var(--qz-text);
            padding: 8px 16px;
            font-family: Roboto, 'Segoe UI', sans-serif;
        }

        html.modern #chart-container {
            min-height: calc(100vh - 16px);
            color: var(--qz-text);
            border-radius: 20px;
            padding: 12px;
        }

        html.modern:not(.light) #chart-container {
            background: var(--qz-surface);
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@2.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="../chartjs/qzcharttheme.js"></script>
    <script src="../chartjs/qzmetriccharts.js"></script>
</head>
<body>
    <div id="chart-container"></div>

    <script>
        let miles = 1; // 1 = km, 0.621371 = miles

        function tq(key, fallback) {
            return window.qzTranslate ? window.qzTranslate(key, fallback) : fallback;
        }

        // All the metrics the program sets, each on its own chart (qzmetriccharts.js); the
        // chips at the top right put the ticked ones together on a shared chart. Before, one
        // main line by the guessed device and at most one more were drawn: a program with
        // cadence and no power showed only the speed, unset (-1).
        let charts = null;

        function metricSeries(workoutData, deviceType) {
            const all = {
                power: { key: 'power', label: tq('workoutEditor.power', 'Power'), unit: 'W', color: '#3b82f6', points: workoutData.watts },
                speed: { key: 'speed', label: tq('workoutEditor.speed', 'Speed'), unit: miles === 1 ? 'km/h' : 'mph', color: '#06b6d4', points: workoutData.speed },
                inclination: { key: 'inclination', label: tq('workoutEditor.incline', 'Incline'), unit: '%', color: '#10b981', points: workoutData.inclination, floor: -50 },
                resistance: { key: 'resistance', label: tq('workoutEditor.resistance', 'Resistance'), unit: '', color: '#8b5cf6', points: workoutData.resistance },
                cadence: { key: 'cadence', label: tq('workoutEditor.cadence', 'Cadence'), unit: 'rpm', color: '#f59e0b', points: workoutData.cadence }
            };
            // The device's own metrics first
            const order = deviceType === 'treadmill'
                ? ['speed', 'inclination', 'power', 'resistance', 'cadence']
                : deviceType === 'elliptical' || deviceType === 'rower'
                    ? ['power', 'resistance', 'cadence', 'inclination', 'speed']
                    : ['power', 'cadence', 'resistance', 'speed', 'inclination'];
            return order.map(function (key) { return all[key]; });
        }

        function updateWorkoutChart(workoutData, deviceType) {
            if (!charts) {
                charts = QzMetricCharts.create(document.getElementById('chart-container'), {
                    storageKey: 'qz.workoutpreview.together',
                    make: function (ctx, config) { return qzChartTheme.create(ctx, config); },
                    restyle: function (chart, config) { qzChartTheme.restyle(chart, config); },
                    timeTitle: function () { return tq('workoutEditor.time', 'Time'); }
                });
            }
            let total = 0;
            ['watts', 'speed', 'inclination', 'resistance', 'cadence'].forEach(function (key) {
                (workoutData[key] || []).forEach(function (p) {
                    if (p && p.x > total) {
                        total = p.x;
                    }
                });
            });
            charts.update({ totalSeconds: total, series: metricSeries(workoutData, deviceType) });
        }

        // WebSocket for communication with Qt
        let ws = null;
        let requestTimer = null;
        let lastDataHash = null; // Track last received data to avoid unnecessary redraws

        // Send request for workout preview data
        function requestWorkoutPreview() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                return;
            }

            const message = {
                msg: 'getworkoutpreview',
                content: {}
            };

            console.log('Requesting workout preview data');
            ws.send(JSON.stringify(message));
        }

        // WebSocket setup
        function setupWebSocket() {
            const host = (!location.host || location.host.length == 0) ? 'localhost:6666' : location.host;
            const wsUrl = `ws://${host}/workoutpreview-ws`;

            console.log('Connecting to WebSocket:', wsUrl);
            ws = new WebSocket(wsUrl);

            ws.onopen = function() {
                console.log('WebSocket connected');
                ws.send(JSON.stringify({ msg: 'webtranslations', content: {} }));

                // Request initial data
                requestWorkoutPreview();

                // Set up periodic updates (every 500ms to catch changes)
                if (requestTimer) {
                    clearInterval(requestTimer);
                }
                requestTimer = setInterval(requestWorkoutPreview, 500);
            };

            ws.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    handleMessage(data);
                } catch (e) {
                    console.error('Error parsing message:', e);
                }
            };

            ws.onerror = function(error) {
                console.error('WebSocket error:', error);
            };

            ws.onclose = function() {
                console.log('WebSocket closed, attempting reconnect in 5 seconds');
                if (requestTimer) {
                    clearInterval(requestTimer);
                    requestTimer = null;
                }
                setTimeout(setupWebSocket, 5000);
            };
        }

        // Handle incoming WebSocket messages
        function handleMessage(data) {
            console.log('Received message:', data);

            const msgType = data.type || data.msg;

            if (msgType === 'workoutpreview' || msgType === 'R_workoutpreview') {
                const content = data.content || data;
                updateWorkoutFromData(content);
            } else if (msgType === 'R_webtranslations') {
                window.qzSetTranslations(data.content || {});
                lastDataHash = null;
            }
        }

        // Update chart from WebSocket data
        function updateWorkoutFromData(data) {
            // Create a hash of the data to detect changes
            const dataHash = JSON.stringify({
                points: data.points,
                watts: data.watts,
                speed: data.speed,
                inclination: data.inclination,
                resistance: data.resistance,
                cadence: data.cadence,
                segments: data.segments,
                hasOpenEndedSteps: data.hasOpenEndedSteps,
                deviceType: data.deviceType
            });

            // Only update if data has changed
            if (dataHash === lastDataHash) {
                return;
            }

            lastDataHash = dataHash;

            const { points, watts, speed, inclination, resistance, cadence, segments, hasOpenEndedSteps, deviceType, miles_unit } = data;

            // Update miles setting if provided
            if (miles_unit !== undefined) {
                miles = miles_unit ? 0.621371 : 1;
            }

            const workoutData = {
                watts: watts || [],
                speed: speed || [],
                inclination: inclination || [],
                resistance: resistance || [],
                cadence: cadence || [],
                segments: segments || [],
                hasOpenEndedSteps: hasOpenEndedSteps || false
            };

            // The C++ backend sends every metric for every second, an unset one as y = -1:
            // detect the actual device type from the set values (it orders the charts)
            function hasSet(list) {
                return list.some(function(p) {
                    return (p !== null && typeof p === 'object' && p.y !== undefined) ? p.y >= 0 : Number(p) >= 0;
                });
            }
            var actualDeviceType = deviceType || 'bike';
            if (!hasSet(workoutData.watts)) {
                if (hasSet(workoutData.speed)) {
                    actualDeviceType = 'treadmill';
                } else if (hasSet(workoutData.resistance)) {
                    actualDeviceType = 'elliptical';
                }
            }

            console.log('Updating chart with new data');
            updateWorkoutChart(workoutData, actualDeviceType);
        }

        // External API for backwards compatibility (if needed)
        window.setWorkoutData = updateWorkoutFromData;

        // Initialize WebSocket connection
        setupWebSocket();

        // Initialize with empty chart
        window.addEventListener('load', function() {
            updateWorkoutChart({
                watts: [],
                speed: [],
                inclination: [],
                resistance: []
            }, 'bike');
        });
    </script>
</body>
</html>
