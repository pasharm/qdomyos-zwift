    <script>
        // Modern look of the app: ChartJsTest.qml passes its theme colours in the fragment
        // (#modern=1&dark=1&bg=...) and later calls qzApplyTheme() when the theme changes.
        // Without the fragment the page keeps its own palette. The charts take the theme
        // through qzcharttheme.js; the images saved for the workout mail stay light.
        window.qzApplyTheme = function (theme) {
            var root = document.documentElement;
            var vars = {
                bg: '--qz-bg', surface: '--qz-surface', surfaceHigh: '--qz-surface-high',
                outline: '--qz-outline', text: '--qz-text', muted: '--qz-muted', accent: '--qz-accent'
            };
            for (var key in vars) {
                if (theme[key]) {
                    root.style.setProperty(vars[key], theme[key]);
                }
            }
            root.classList.add('modern');
            root.classList.toggle('light', !theme.dark);
            root.style.colorScheme = theme.dark ? 'dark' : 'light';
            if (window.qzChartTheme) {
                window.qzChartTheme.refresh();
            }
        };
        (function () {
            var theme = {};
            window.location.hash.substring(1).split('&').forEach(function (pair) {
                var i = pair.indexOf('=');
                if (i > 0) {
                    theme[pair.substring(0, i)] = decodeURIComponent(pair.substring(i + 1));
                }
            });
            if (theme.modern === '1') {
                theme.dark = theme.dark === '1';
                window.qzApplyTheme(theme);
            }
        })();
    </script>

    <script>

        // instead of growing from zero. 1 ms, not off: animation.onComplete saves the images
        if (/[?&]still=/.test(window.location.search)) {
            Chart.defaults.animation.duration = 1;
        }
    </script>

    <!-- Modern look: sizes shared with the QML pages and the other web pages -->
    <link rel="stylesheet" href="qz-modern.css">
    <style>
    /* the live update period; the --qz-* colours come from a themed page, the rest is the default */
    /* Material 3 segmented button: one group, the selected segment filled with the accent */
    #live_refresh_box {
        align-items: center;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 4px 8px;
        margin: 4px 0 8px;
    }
    #live_refresh {
        display: inline-flex;
    }
    #live_refresh button {
        min-height: 40px;
        min-width: 44px;
        margin: 0 0 0 -1px;
        padding: 0 10px;
        font-size: 13px;
        font-weight: 500;
        border: 1px solid var(--qz-outline, grey);
        border-radius: 0;
        background-color: transparent;
        color: var(--qz-text, white);
    }
    #live_refresh button:first-child {
        margin-left: 0;
        border-radius: 20px 0 0 20px;
    }
    #live_refresh button:last-child {
        border-radius: 0 20px 20px 0;
    }
    #live_refresh button.on {
        position: relative;
        background-color: var(--qz-accent, #9c7cf4);
        border-color: var(--qz-accent, #9c7cf4);
        color: var(--qz-bg, #1d2330);
        font-weight: 700;
    }
    /* Full screen charts (chartfullscreen.js): the button in the top-left corner of a card, in
       its title row; the spread card covers the page, the page under it does not scroll */
    .qz-fs-card {
        position: relative;
    }
    .qz-fs-button {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 2;
        width: 36px;
        height: 36px;
        padding: 6px;
        border: 0;
        border-radius: 18px;
        background: transparent;
        color: rgb(120,120,120);
        color: var(--qz-muted, rgb(120,120,120));
        line-height: 0;
        -webkit-tap-highlight-color: transparent;
    }
    .qz-fs-button:active {
        background-color: rgba(128,128,128,0.25);
    }
    html.qz-fs,
    html.qz-fs body {
        overflow: hidden;
    }
    .qz-fs-card.qz-fs-on {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 90;
        border-radius: 0 !important;
    }
    .qz-fs-on .qz-fs-button {
        width: 48px;
        height: 48px;
        padding: 10px;
        border-radius: 24px;
    }
    .qz-fs-on .qz-fs-button svg {
        width: 28px;
        height: 28px;
    }
    #qz_fs_counter {
        display: none;
        position: fixed;
        top: 12px;
        right: 16px;
        z-index: 91;
        color: rgb(120,120,120);
        color: var(--qz-muted, rgb(120,120,120));
        font: 600 16px Roboto, "Segoe UI", sans-serif;
    }
    html.qz-fs #qz_fs_counter {
        display: block;
    }
    #qz_fs_toast {
        position: fixed;
        left: 50%;
        bottom: 32px;
        z-index: 92;
        max-width: 80%;
        padding: 12px 20px;
        border-radius: 24px;
        background-color: rgba(40,40,40,0.9);
        color: white;
        font: 500 15px Roboto, "Segoe UI", sans-serif;
        text-align: center;
        opacity: 0;
        pointer-events: none;
        -webkit-transform: translateX(-50%);
        transform: translateX(-50%);
        -webkit-transition: opacity 0.3s;
        transition: opacity 0.3s;
    }
    #qz_fs_toast.on {
        opacity: 1;
    }
    canvas{
        -moz-user-select: none;
        -webkit-user-select: none;
        -ms-user-select: none;
    }
    /* Modern look: the page chrome in the app theme; the inline styles of the markup need
       !important. Charts keep their white cards. */
    html.modern body,
    html.modern #watt_badge {
        background-color: var(--qz-bg) !important;
        font-family: Roboto, "Segoe UI", sans-serif;
    }
    html.modern body {
        margin: 0;
        padding: 12px 16px;
    }
    html.modern .workoutName,
    html.modern .instructorName,
    html.modern td[class^="summary_"] {
        color: var(--qz-text) !important;
        font-family: inherit !important;
    }
    html.modern .workoutStartDate,
    html.modern tr[align="center"],
    html.modern .watts_avg, html.modern .watts_max,
    html.modern .heart_avg, html.modern .heart_max {
        color: var(--qz-muted) !important;
        font-family: inherit !important;
    }
    html.modern td[class^="summary_"] {
        font-size: 18px !important;
        font-weight: 600 !important;
        padding-bottom: 10px;
    }
    html.modern hr {
        border: 0;
        height: 1px;
        width: 100%;
        background: var(--qz-outline);
        opacity: 0.5;
        margin: 12px 0;
    }
    /* The summary block: a filled card, the QZ logo in its middle as in the classic look */
    html.modern table[background] {
        background-color: var(--qz-surface);
        border-radius: var(--qz-radius-card, 16px);
        padding: 8px 4px;
        border-spacing: 0 4px;
    }
    html.modern div[style*="background-color:white"] {
        border-radius: var(--qz-radius-card, 16px) !important;
    }
    html.modern .watts_avg, html.modern .watts_max,
    html.modern .heart_avg, html.modern .heart_max {
        padding: 6px 8px 0;
    }
    /* Dark theme: the chart cards in the surface colour, the canvas fills them */
    html.modern:not(.light) div[style*="background-color:white"] {
        background-color: var(--qz-surface) !important;
    }
    html.modern #loading {
        background-color: var(--qz-bg) !important;
    }
    </style>
</head>
