# test branch: run two APKs that were already built on one emulator and keep logcat and
# screenshots (no build). T-487, PR-4: header and side menu of the modern look - the classic look
# of the PR head against origin/master of the same commit, the modern look of the head.
name: CI

on:
  workflow_dispatch:
    inputs:
      head:
        description: run id of the build of the PR head
        required: true
      base:
        description: run id of the build of origin/master (same commit as the PR base)
        required: true
      log_debug:
        description: log_debug for the run
        required: false
        default: 'true'

jobs:
  emulator-logcat:
    # ubuntu-latest of the upstream repository (T-272)
    runs-on: ubuntu-26.04
    timeout-minutes: 55
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK of the PR head
        uses: actions/download-artifact@v4
        with:
          name: fdroid-android-trial
          path: apk-head
          run-id: ${{ inputs.head }}
          github-token: ${{ github.token }}

      - name: Download APK of the base
        uses: actions/download-artifact@v4
        with:
          name: fdroid-android-trial
          path: apk-base
          run-id: ${{ inputs.base }}
          github-token: ${{ github.token }}

      - name: Setup Java for Android Emulator
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run the scenario and record logcat
        # A step stuck on adb ends here, and the evidence is still uploaded
        timeout-minutes: 48
        uses: ReactiveCircus/android-emulator-runner@v2
        env:
          LOG_DEBUG: ${{ inputs.log_debug }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: bash .github/emu.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat-${{ inputs.head }}-t487
          path: |
            *.png
            full_logcat.txt
            steps.log
            dumps/
          if-no-files-found: warn
