# Test only (T-518): files of a previous install in gpx/, settings/ and profiles/ after a reinstall -
# master (base) leaves them out, the branch (head) restores them in one pass from the QZ folder
name: CI

on:
  workflow_dispatch:
    inputs:
      head:
        description: run id of the branch build with the fdroid-android-trial artifact
        required: true
      base:
        description: run id of a master build with the fdroid-android-trial artifact (empty - no master side)
        required: false
        default: ''
      apis:
        description: API levels as a JSON list
        required: false
        default: '[35]'
      modern:
        description: ui_modern for the run
        required: false
        default: 'false'
      log_debug:
        description: log_debug for the run
        required: false
        default: 'true'

jobs:
  emulator-logcat:
    # ubuntu-latest of the upstream repository (T-272)
    runs-on: ubuntu-26.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        api: ${{ fromJSON(inputs.apis) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: fdroid-android-trial
          path: apk-head
          run-id: ${{ inputs.head }}
          github-token: ${{ github.token }}

      - name: Download the master APK
        if: inputs.base != ''
        uses: actions/download-artifact@v4
        with:
          name: fdroid-android-trial
          path: apk-base
          run-id: ${{ inputs.base }}
          github-token: ${{ github.token }}

      - name: Setup Java for Android Emulator
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run the scenario and record logcat
        # A step stuck on adb ends here, and the evidence is still uploaded
        timeout-minutes: 48
        uses: ReactiveCircus/android-emulator-runner@v2
        env:
          LOG_DEBUG: ${{ inputs.log_debug }}
          UI_MODERN: ${{ inputs.modern }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: bash .github/emu.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat-${{ inputs.head }}-t518-api${{ matrix.api }}
          path: |
            *.png
            full_logcat.txt
            t518_logcat.txt
            steps.log
            dumps/
            drv/
          if-no-files-found: warn
