# test branch (T-270): build for the iOS simulator as the upstream ios-build job does, then run the
# app on a simulator and keep frames, the app output and the .app (no device, no secrets).
# With app_run the build is skipped and the .app comes from the ios-sim artifact of that run
name: CI

on:
  workflow_dispatch:
    inputs:
      app_run:
        description: run id whose ios-sim artifact has the .app (empty = build it)
        required: false
        default: ''
      big_size:
        description: Dynamic Type of the second start (simctl ui content_size)
        required: false
        default: 'extra-extra-extra-large'
      wait:
        description: seconds after a start before the frame
        required: false
        default: '45'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-sim:
    runs-on: macos-14
    env:
      BUILD: ${{ inputs.app_run == '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.BUILD == 'true'
      - uses: actions/checkout@v4
        if: env.BUILD != 'true'
        with:
          sparse-checkout: .github
      - name: Checkout submodule repo
        if: env.BUILD == 'true'
        uses: actions/checkout@v4
        with:
          repository: bluetiger9/SmtpClient-for-Qt
          path: "src/smtpclient/"
          ref: 3fa4a0fe5797070339422cf18b5e9ed8dcb91f9c
      - name: Checkout googletest
        if: env.BUILD == 'true'
        uses: actions/checkout@v4
        with:
          repository: google/googletest
          path: "tst/googletest/"
          ref: "release-1.12.1"

      - name: Install Qt iOS
        if: env.BUILD == 'true'
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          host: 'mac'
          target: 'ios'
          modules: 'qtcharts  qtnetworkauth'
          dir: '${{ github.workspace }}/output/ios/'
          cache: 'true'
          cache-key-prefix: 'install-qt-action-ios'

      - name: fix qt
        if: env.BUILD == 'true'
        run: |
          find ${{ github.workspace }}/output/ios/ -name 'ios.conf' -exec sed -i '' 's/ios-simulator/iphonesimulator/g' {} \;
          find ${{ github.workspace }}/output/ios/ -name 'devices.py' -exec sed -i '' 's/\/usr\/bin\/python/\/usr\/bin\/python3/g' {} \;
          find ./ -name 'qdomyos-zwift-lib.pro' -exec sed -i '' 's/TARGET = qdomyos-zwift/TARGET = qdomyoszwift/g' {} \;
          cp qt-patches/ios/5.15.2/binary/*.* ${{ github.workspace }}/output/ios/Qt/5.15.2/ios/lib/

      - name: Build
        if: env.BUILD == 'true'
        run: |
          cd src
          for k in STRAVA_SECRET_KEY PELOTON_SECRET_KEY SMTP_USERNAME SMTP_PASSWORD SMTP_SERVER INTERVALSICU_CLIENT_ID INTERVALSICU_CLIENT_SECRET; do
            echo "#define $k " >> secret.h
          done
          cd ..
          qmake CONFIG+=debug CONFIG+=iphonesimulator && make -j4

      - name: The .app of an earlier run
        if: env.BUILD != 'true'
        uses: actions/download-artifact@v4
        with:
          name: ios-sim
          path: prev
          run-id: ${{ inputs.app_run }}
          github-token: ${{ github.token }}

      - name: Find the app
        id: app
        run: |
          mkdir -p out
          if [ "$BUILD" = "true" ]; then
            APP=$(find . -name '*.app' -type d -path '*iphonesimulator*' | grep -v '/output/' | head -n 1)
          else
            mkdir -p appdir && ditto -x -k prev/app.zip appdir
            APP=$(find appdir -maxdepth 1 -name '*.app' -type d | head -n 1)
          fi
          echo "app: $APP"
          test -n "$APP"
          PL="$APP/Info.plist"
          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PL")
          EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PL")
          echo "bundle id: $BID, executable: $EXE"
          echo "CFBundleVersion: '$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PL" 2>&1)'"
          echo "CFBundleShortVersionString: '$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PL" 2>&1)'"
          file "$APP/$EXE"
          if [ "$BUILD" = "true" ]; then ditto -c -k --keepParent "$APP" out/app.zip; else cp prev/app.zip out/app.zip; fi
          # the simulator refuses an app without a valid CFBundleVersion (qmake leaves it empty here)
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 1' "$PL" 2>/dev/null || /usr/libexec/PlistBuddy -c 'Add :CFBundleVersion string 1' "$PL"
          V=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PL" 2>/dev/null || true)
          case "$V" in ''|*'$'*) /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 1.0' "$PL" 2>/dev/null || /usr/libexec/PlistBuddy -c 'Add :CFBundleShortVersionString string 1.0' "$PL" ;; esac
          codesign --force --deep --sign - "$APP"
          echo "app=$APP" >> $GITHUB_OUTPUT
          echo "bid=$BID" >> $GITHUB_OUTPUT

      - name: Rosetta (the app of Qt 5.15.2 is x86_64)
        run: softwareupdate --install-rosetta --agree-to-license || true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: idb (taps and the accessibility tree)
        run: |
          # brew refuses the facebook/fb tap ("untrusted"), and idb 1.7.x wants macOS 15 + Xcode 26:
          # the last companion for Xcode 15 is 1.1.8, its client is fb-idb 1.1.7
          curl -sSL -o idb.tar.gz https://github.com/facebook/idb/releases/download/v1.1.8/idb-companion.universal.tar.gz
          sudo mkdir -p /usr/local/opt /usr/local/bin
          sudo tar -xzf idb.tar.gz -C /usr/local/opt
          ls /usr/local/opt
          sudo ln -sf /usr/local/opt/idb-companion.universal/bin/idb_companion /usr/local/bin/idb_companion
          idb_companion --version || true
          python -m pip install fb-idb==1.1.7 || true
          echo "IDB=$(python -c 'import shutil; print(shutil.which("idb") or "idb")')" >> $GITHUB_ENV

      - name: Run on a simulator
        env:
          APP: ${{ steps.app.outputs.app }}
          BID: ${{ steps.app.outputs.bid }}
          BIG: ${{ inputs.big_size }}
          WAIT: ${{ inputs.wait }}
        run: |
          set -x
          xcodebuild -version
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          for rt in sorted(d, reverse=True):
              if "iOS" not in rt:
                  continue
              for dev in d[rt]:
                  if dev["name"].startswith("iPhone"):
                      print(dev["udid"]); sys.exit()
          ')
          echo "device: $UDID"
          test -n "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          # QSettings on iOS = CFPreferences "com.<organizationDomain, dots as dashes>.<applicationName>" (main.cpp),
          # in the app container; a last device closes the first-run wizard (homeform::firstRun)
          QSD=com.robertoviola-cloud.qDomyos-Zwift
          DATA=$(xcrun simctl get_app_container "$UDID" "$BID" data)
          mkdir -p "$DATA/Library/Preferences"
          # "defaults write <path>" did not create the file; PlistBuddy does
          /usr/libexec/PlistBuddy -c 'Add :bluetooth_lastdevice_name string TestBike' "$DATA/Library/Preferences/$QSD.plist" || true
          # a fake bike: the home page gets its tiles without a trainer
          /usr/libexec/PlistBuddy -c 'Add :applewatch_fakedevice bool true' "$DATA/Library/Preferences/$QSD.plist" || true
          # the debug log of QZ (homeform::getWritableAppDir), with the QML warnings
          /usr/libexec/PlistBuddy -c 'Add :log_debug bool true' "$DATA/Library/Preferences/$QSD.plist" || true
          xcrun simctl spawn "$UDID" defaults write "$QSD" bluetooth_lastdevice_name -string "Test Bike" || true
          plutil -p "$DATA/Library/Preferences/$QSD.plist" > out/defaults.txt 2>&1 || true
          shoot() {
            xcrun simctl launch --terminate-running-process --stdout="$PWD/out/$1.stdout.txt" --stderr="$PWD/out/$1.stderr.txt" "$UDID" "$BID" || echo "launch failed: $?"
            sleep "$WAIT"
            xcrun simctl io "$UDID" screenshot "out/$1.png" || true
            "$IDB" ui describe-all --udid "$UDID" --json > "out/$1.ui.json" 2> "out/$1.ui.err.txt" || true
            python .github/ios_nav.py "$IDB" "$UDID" out "$1" > "out/$1.nav.txt" 2>&1 || true
            xcrun simctl spawn "$UDID" launchctl list | grep -i "$BID" || echo "app not running after $WAIT s"
          }
          xcrun simctl ui "$UDID" content_size large
          shoot 01-default
          xcrun simctl ui "$UDID" content_size "$BIG"
          shoot 02-big
          xcrun simctl spawn "$UDID" log show --last 5m --style compact --predicate "process CONTAINS[c] 'qdomyos'" > out/syslog.txt 2>&1 || true
          ls ~/Library/Logs/DiagnosticReports/ > out/crash-list.txt 2>&1 || true
          cp ~/Library/Logs/DiagnosticReports/*qdomyos* out/ 2>/dev/null || true
          find "$DATA" -name "debug-*.log" -exec cp {} out/ \; || true
          cat out/debug-*.log 2>/dev/null | grep -a -E "T270|qml|QML" | head -400 > out/qml-log.txt || true
          for f in "$DATA"/Library/Preferences/*.plist; do echo "== $f"; plutil -p "$f" | head -40; done > out/prefs-after.txt 2>&1 || true

      - name: Keep the output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-sim
          path: out/
