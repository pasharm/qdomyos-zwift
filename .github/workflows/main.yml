# Test only (T-514): the modern file lists and pages - frames of master (base) and the branch (head),
# classic and modern look, API 30 and 35
name: CI

on:
  workflow_dispatch:
    inputs:
      head:
        description: run id of the branch build with the fdroid-android-trial artifact
        required: true
      base:
        description: run id of the clean master build with the fdroid-android-trial artifact
        required: true
      pages:
        description: lists (PR 6a-1), service (PR 6a-2), tb (TalkBack on both; head - lists build, base - service build; apis '[35]') or tbc (TalkBack on the classic programs list; base - master, head - lists)
        required: false
        default: lists
      apis:
        description: API levels as a JSON list
        required: false
        default: '[30, 35]'
      log_debug:
        description: log_debug for the run
        required: false
        default: 'true'

jobs:
  emulator-logcat:
    # ubuntu-latest of the upstream repository (T-272)
    runs-on: ubuntu-26.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        api: ${{ fromJSON(inputs.apis) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: fdroid-android-trial
          path: apk-head
          run-id: ${{ inputs.head }}
          github-token: ${{ github.token }}

      - name: Download the master APK
        uses: actions/download-artifact@v4
        with:
          name: fdroid-android-trial
          path: apk-base
          run-id: ${{ inputs.base }}
          github-token: ${{ github.token }}

      - name: Setup Java for Android Emulator
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run the scenario and record logcat
        # A step stuck on adb ends here, and the evidence is still uploaded
        timeout-minutes: 48
        uses: ReactiveCircus/android-emulator-runner@v2
        env:
          LOG_DEBUG: ${{ inputs.log_debug }}
          PAGES: ${{ inputs.pages }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: bash .github/emu.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat-${{ inputs.head }}-t514-${{ inputs.pages }}-api${{ matrix.api }}
          path: |
            *.png
            raw-?c-*
            full_logcat.txt
            steps.log
            drv/*.txt
            tbshots/
            dumps/
            drv/
          if-no-files-found: warn
