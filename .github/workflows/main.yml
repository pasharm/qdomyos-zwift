# Test only (T-643; the workflow of T-627): build QZ for the iOS simulator as Xcode Cloud does, then
# the buttons of the settings pages on UiButton (.github/ios_t643.py): General Options rows (App Language,
# Player Weight, Gender) in modern light, modern dark and classic; the TTS page and Inclination Overrides (modern light).
# With app_run the build is skipped and the .app comes from the ios-cloud-sim artifact of that run
name: CI

on:
  workflow_dispatch:
    inputs:
      app_run:
        description: run id whose ios-cloud-sim artifact has the .app (empty = build it)
        required: false
        default: ''
      side:
        description: base (master) or head (the PR branch) - the prefix of the frames
        required: true
        default: head
      wait:
        description: seconds after a start before the frame
        required: false
        default: '45'
      cases:
        description: cases of ios_t643.py by spaces (empty - changed tmpl; the run 44837519116 had light dark classic tts inc)
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios-cloud-sim:
    runs-on: macos-15-intel
    timeout-minutes: 150
    env:
      BUILD: ${{ inputs.app_run == '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.BUILD == 'true'
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        if: env.BUILD != 'true'
        with:
          sparse-checkout: .github

      - name: Xcode
        run: |
          ls -d /Applications/Xcode*.app
          # the newest Xcode; the scripts of Xcode Cloud use /Applications/Xcode.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          echo "newest: $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          if [ "$(readlink -f /Applications/Xcode.app)" != "$(readlink -f "$XC")" ]; then
            sudo rm -rf /Applications/Xcode.app
            sudo ln -s "$XC" /Applications/Xcode.app
          fi
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Xcode Cloud scripts (ci_post_clone.sh, ci_pre_xcodebuild.sh)
        if: env.BUILD == 'true'
        run: |
          # what Xcode Cloud gives the scripts: the repository path and /Volumes/workspace/repository
          export CI_PRIMARY_REPOSITORY_PATH="$GITHUB_WORKSPACE"
          echo "CI_PRIMARY_REPOSITORY_PATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          sudo mkdir -p /Volumes/workspace
          sudo ln -sfn "$GITHUB_WORKSPACE" /Volumes/workspace/repository
          cd build-qdomyos-zwift-Qt_5_15_2_for_iOS-Debug/ci_scripts
          bash ci_post_clone.sh
          bash ci_pre_xcodebuild.sh

      - name: xcodebuild for the simulator (Release, the committed project)
        if: env.BUILD == 'true'
        run: |
          mkdir -p out
          bash .github/scripts/build_ios_simulator.sh out/xcodebuild.log

      - name: The .app of an earlier run
        if: env.BUILD != 'true'
        uses: actions/download-artifact@v4
        with:
          name: ios-cloud-sim
          path: prev
          run-id: ${{ inputs.app_run }}
          github-token: ${{ github.token }}

      - name: Find the app
        id: app
        run: |
          mkdir -p out
          if [ "$BUILD" = "true" ]; then
            APP=$(find dd/Build/Products -maxdepth 2 -name '*.app' -type d -path '*iphonesimulator*' | grep -v -i watch | head -n 1)
          else
            mkdir -p appdir && ditto -x -k prev/app.zip appdir
            APP=$(find appdir -maxdepth 1 -name '*.app' -type d | head -n 1)
          fi
          echo "app: $APP"
          test -n "$APP"
          PL="$APP/Info.plist"
          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PL")
          EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PL")
          echo "bundle id: $BID, executable: $EXE"
          echo "CFBundleVersion: '$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PL" 2>&1)'"
          file "$APP/$EXE"
          if [ "$BUILD" = "true" ]; then ditto -c -k --keepParent "$APP" out/app.zip; else cp prev/app.zip out/app.zip; fi
          V=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PL" 2>/dev/null || true)
          case "$V" in ''|*'$'*) /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 1' "$PL" 2>/dev/null || /usr/libexec/PlistBuddy -c 'Add :CFBundleVersion string 1' "$PL" ;; esac
          codesign --force --deep --sign - "$APP"
          echo "app=$APP" >> $GITHUB_OUTPUT
          echo "bid=$BID" >> $GITHUB_OUTPUT

      - name: Rosetta (the simulator slice of Qt 5.15.2 is x86_64)
        run: softwareupdate --install-rosetta --agree-to-license || true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: idb (taps and the accessibility tree)
        run: |
          if ! command -v idb_companion; then
            curl -sSL -o idb.tar.gz https://github.com/facebook/idb/releases/download/v1.1.8/idb-companion.universal.tar.gz
            sudo mkdir -p /usr/local/opt /usr/local/bin
            sudo tar -xzf idb.tar.gz -C /usr/local/opt
            sudo ln -sf /usr/local/opt/idb-companion.universal/bin/idb_companion /usr/local/bin/idb_companion
          fi
          idb_companion --version || true
          python -m pip install fb-idb || true
          echo "IDB=$(python -c 'import shutil; print(shutil.which("idb") or "idb")')" >> $GITHUB_ENV

      - name: Run on a simulator
        env:
          APP: ${{ steps.app.outputs.app }}
          BID: ${{ steps.app.outputs.bid }}
          SIDE: ${{ inputs.side }}
          WAIT: ${{ inputs.wait }}
          CASES_IN: ${{ inputs.cases }}
        run: |
          set -x
          mkdir -p out
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          for rt in sorted(d, reverse=True):
              if "iOS" not in rt:
                  continue
              for dev in d[rt]:
                  if dev["name"].startswith("iPhone"):
                      print(dev["udid"]); sys.exit()
          ')
          echo "device: $UDID"
          test -n "$UDID"
          # T-510: the on-screen keyboard as on a phone - the simulator connects the Mac keyboard as a
          # hardware one by default and then shows no keyboard on the screen
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          /usr/libexec/PlistBuddy -c "Add :DevicePreferences:$UDID:ConnectHardwareKeyboard bool false" ~/Library/Preferences/com.apple.iphonesimulator.plist || \
            /usr/libexec/PlistBuddy -c "Set :DevicePreferences:$UDID:ConnectHardwareKeyboard false" ~/Library/Preferences/com.apple.iphonesimulator.plist || true
          defaults read com.apple.iphonesimulator > out/simulator-prefs.txt 2>&1 || true
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          QSD=com.robertoviola-cloud.qDomyos-Zwift
          FAIL=0
          xcrun simctl ui "$UDID" appearance light
          # one start per case, a fresh install each (the keys of the case only)
          CASES="${CASES_IN:-changed tmpl}"
          for CASE in $CASES; do
            MODERN=true; THEME=light
            case $CASE in
              dark) THEME=dark ;;
              classic) MODERN=false ;;
            esac
            xcrun simctl uninstall "$UDID" "$BID" || true
            xcrun simctl install "$UDID" "$APP"
            # QSettings on iOS = CFPreferences "com.<organizationDomain, dots as dashes>.<applicationName>" (main.cpp),
            # in the app container; a last device closes the first-run wizard (homeform::firstRun)
            DATA=$(xcrun simctl get_app_container "$UDID" "$BID" data)
            mkdir -p "$DATA/Library/Preferences"
            PREFS="$DATA/Library/Preferences/$QSD.plist"
            /usr/libexec/PlistBuddy -c 'Add :log_debug bool true' "$PREFS"
            /usr/libexec/PlistBuddy -c "Add :ui_modern bool $MODERN" "$PREFS"
            /usr/libexec/PlistBuddy -c "Add :ui_theme_mode string $THEME" "$PREFS"
            # the fake device gives the home page its "Lap" (the sign of the library)
            /usr/libexec/PlistBuddy -c 'Add :bluetooth_lastdevice_name string T643-FAKE' "$PREFS"
            /usr/libexec/PlistBuddy -c 'Add :applewatch_fakedevice bool true' "$PREFS"
            plutil -p "$PREFS" > "out/defaults-$CASE.txt" 2>&1 || true
            # plutil -p prints a bool as 1 / 0 (run 44624357909)
            if [ "$MODERN" = true ]; then BIT=1; else BIT=0; fi
            grep -q "\"ui_modern\" => $BIT" "out/defaults-$CASE.txt" || { echo "!! $CASE: ui_modern not in the plist"; FAIL=1; }
            grep -q "\"ui_theme_mode\" => \"$THEME\"" "out/defaults-$CASE.txt" || { echo "!! $CASE: ui_theme_mode not in the plist"; FAIL=1; }
            xcrun simctl launch --terminate-running-process --stdout="$PWD/out/$CASE.stdout.txt" --stderr="$PWD/out/$CASE.stderr.txt" "$UDID" "$BID" || echo "launch failed: $?"
            sleep "$WAIT"
            xcrun simctl spawn "$UDID" launchctl list | grep -i "$BID" || { echo "!! $CASE: app not running"; FAIL=1; }
            # the notification question keeps the app inactive: the library closes it (iosnav dismiss_alerts)
            # bash -e of the step: a failed walk must not end the step before the other cases and the logs
            RC=0
            python .github/ios_t643.py "$IDB" "$UDID" out "$SIDE-$CASE" "$CASE" > "out/$CASE.walk.txt" 2>&1 || RC=$?
            cat "out/$CASE.walk.txt"
            [ "$RC" = 0 ] || { echo "!! $CASE walk: code $RC (see $CASE.walk.txt)"; FAIL=1; }
            mkdir -p "out/logs-$CASE"
            find "$DATA" -name "debug-*.log" -exec cp {} "out/logs-$CASE/" \; || true
          done
          xcrun simctl spawn "$UDID" log show --last 60m --style compact --predicate "process CONTAINS[c] 'qdomyos'" > out/syslog.txt 2>&1 || true
          ls ~/Library/Logs/DiagnosticReports/ > out/crash-list.txt 2>&1 || true
          cp ~/Library/Logs/DiagnosticReports/*qdomyos* out/ 2>/dev/null || true
          for CASE in $CASES; do
            cat out/logs-$CASE/debug-*.log 2>/dev/null | grep -a -i -E "qml|ReferenceError|TypeError|Unable to assign" | head -600 > "out/qml-log-$CASE.txt" || true
            # warnings and JS errors of the changed files - listed, not a failure (no master side to tell an old
            # one from a new one; the reader compares with the Android runs of test/t643-emu)
            grep -a -E "UiButton\.qml|settings-tts\.qml|settings-treadmill-inclination-override\.qml|settings\.qml|TemplateWebServer\.qml|TemplateTcpClient\.qml" "out/qml-log-$CASE.txt" | grep -a -E "Warning:|Critical:|Fatal:|ReferenceError|TypeError|Unable to assign" > "out/changed-qml-$CASE.txt" || true
            [ -s "out/changed-qml-$CASE.txt" ] && { echo "~~ $CASE: QML warnings of the changed files:"; head -40 "out/changed-qml-$CASE.txt"; }
          done
          ls out/*.png
          exit $FAIL

      - name: Keep the output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-cloud-sim
          path: out/
