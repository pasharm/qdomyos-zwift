# test branch (T-211 cost): run one APK that was already built (test/t211-cost, the settings search of
# master with a log line per search step) on emulators of two API levels and keep the T211COST lines
# of the log (no build).
name: CI

on:
  workflow_dispatch:
    inputs:
      source:
        description: run id of the build with the T211COST log lines (fdroid-android-trial)
        required: true

jobs:
  emulator-cost:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download the APK
        uses: actions/download-artifact@v4
        with:
          name: fdroid-android-trial
          path: apk-debug
          run-id: ${{ inputs.source }}
          github-token: ${{ github.token }}

      - name: Setup Java for Android Emulator
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cost of one settings search step
        timeout-minutes: 25
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: bash .github/emu.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-cost-${{ inputs.source }}-api${{ matrix.api }}
          path: |
            *.png
            full_logcat.txt
            steps.log
            cost.txt
            dumps/
          if-no-files-found: warn
