# test branch: run already built APKs on the emulator and keep logcat and screenshots (no
# build). T-182: the folder import of the history after a reinstall, timed on two builds side
# by side - plain master (test/t182-base) and the fix (test/t182-fix). Documents/QZ is the work
# folder only from API 34 on, so the emulator stays at 35.
name: CI

on:
  workflow_dispatch:
    inputs:
      base:
        description: run id of the build of plain master
        required: true
      fix:
        description: run id of the build of the fix
        required: true
      modern:
        description: ui_modern for the run (false = the classic look)
        required: false
        default: 'false'

jobs:
  emulator-logcat:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        build: [base, fix]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK from the build run
        uses: actions/download-artifact@v4
        with:
          name: fdroid-android-trial
          path: apk-debug
          run-id: ${{ matrix.build == 'base' && inputs.base || inputs.fix }}
          github-token: ${{ github.token }}

      - name: Setup Java for Android Emulator
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Start the app and record logcat
        uses: ReactiveCircus/android-emulator-runner@v2
        env:
          UI_MODERN: ${{ inputs.modern }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: bash .github/emu.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat-t182-${{ matrix.build }}
          path: |
            screenshot.png
            *.png
            process_list.txt
            full_logcat.txt
            steps.log
            t182_logcat.txt
            dumps/
            qz-logs/
          if-no-files-found: warn
