# test branch: run an APK that was already built on one emulator and keep logcat and
# screenshots (no build). T-400: the fix and the reference APK of master, one after the other.
name: CI

on:
  workflow_dispatch:
    inputs:
      source:
        description: run id of the build to test (this fork)
        required: true
      baseline:
        description: run id of the reference build (master of the upstream, same base commit)
        required: true
      baseline_repo:
        description: repository of the reference run
        required: false
        default: 'cagnulein/qdomyos-zwift'

jobs:
  emulator-logcat:
    # the image of the upstream emulator test (qz-ci-build)
    runs-on: ubuntu-26.04
    # Four cases of ~4 min; a step stuck on adb ends here instead of after 6 hours
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK from the build run
        uses: actions/download-artifact@v4
        with:
          name: fdroid-android-trial
          path: apk-debug
          run-id: ${{ inputs.source }}
          github-token: ${{ github.token }}

      - name: Download the reference APK
        uses: actions/download-artifact@v4
        with:
          name: fdroid-android-trial
          path: apk-base
          run-id: ${{ inputs.baseline }}
          repository: ${{ inputs.baseline_repo }}
          github-token: ${{ github.token }}

      - name: Setup Java for Android Emulator
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Start the app and record logcat
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: bash .github/emu.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat-${{ inputs.source }}-t400
          path: |
            *.png
            full_logcat.txt
            steps.log
            dumps/
          if-no-files-found: warn
