# emu-lib: tools/emu/workflow.yml sha 9ff8838689c1 - edit there, then tools/emu/sync.py (T-505)
# Test only: the emulator scenario .github/emu.sh of an emu branch on the APK of two builds (T-505, T-534).
# One source: tools/emu/workflow.yml of the work folder; `tools/emu/sync.py wt/<name> --workflow` writes it as
# .github/workflows/main.yml of the branch. A task input of its own (PAGES of test/t495-emu): edit the copy -
# sync then keeps it (edited) and says so.
#
# A full run: head and base, cases and apis by default. An intermediate run after a fix (T-534): only the new
# cases (cases), one API (apis: [30]), no side before (base empty) - minutes instead of 20-30; the run says
# "== partial run" in steps.log and its artifact ends in -part. The last run before the beta and a PR is a
# full one (qz-ci-build).
#
# The sides in jobs of their own (T-660): a scenario whose sides do not look at each other says so by the line
# `# emu-split: sides` in .github/emu.sh, and each side (b - base, h - head) runs on its own emulator, in a job
# of the matrix api x side - a full run takes the time of one side plus the boot of the emulator in each job
# (T-596: ~17 min instead of ~31; the short T-645: ~7 instead of ~10). The job plan reads
# the mark (split=auto, the default); without it - both sides in one job, as before: many scenarios compare the
# sides after the loop (same_page, same_as_before, "no head pid" - the review of T-660), and a branch synced
# with this template must not turn red. split=true/false - by hand over the mark. The job gives the scenario
# EMU_SIDE (lib.sh: side_on skips the other side, finish of side b needs no check); both APKs are downloaded
# in both jobs, so a comparison left in a marked scenario fails loudly on the missing frames instead of being
# skipped in silence (check_emu_script.py: split-compare). The artifact ends in -b/-h, and get_apk.py --emu
# compares the QML of the pair.
name: CI
run-name: emu ${{ inputs.cases || 'all cases' }}, API ${{ inputs.apis }}${{ inputs.base == '' && ', no base' || '' }}

on:
  workflow_dispatch:
    inputs:
      head:
        description: run id of the build after the change, with the fdroid-android-trial artifact
        required: true
      base:
        description: run id of the build before the change (fdroid-android-trial); empty - no side before
        required: false
        default: ''
      cases:
        description: "cases of emu.sh: globs of <case> or <function>/<case>, by spaces or commas (landopen/hc); empty - all"
        required: false
        default: ''
      apis:
        description: API levels, a JSON list ([30] for an intermediate run)
        required: false
        default: '[30, 35]'
      log_debug:
        description: log_debug for the run
        required: false
        default: 'true'
      split:
        description: "auto - the sides in jobs of their own if emu.sh has '# emu-split: sides' (T-660); true; false - one job"
        required: false
        default: 'auto'

jobs:
  plan:
    # the sides of the matrix: both - one job for the two sides; no base - only h (a job of side b would have
    # nothing to run); else b and h. split=auto - by the mark of the scenario (T-660)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      sides: ${{ steps.sides.outputs.sides }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Sides of the run
        id: sides
        env:
          SPLIT: ${{ inputs.split }}
          BASE: ${{ inputs.base }}
        run: |
          split=$SPLIT
          if [ "$split" = auto ]; then
            if grep -q -x '# emu-split: sides' .github/emu.sh; then split=true; else split=false; fi
          fi
          case $split in
            true) if [ -z "$BASE" ]; then sides='["h"]'; else sides='["b", "h"]'; fi ;;
            false) sides='["both"]' ;;
            *) echo "split: '$SPLIT' - auto, true or false"; exit 1 ;;
          esac
          echo "split=$split (input $SPLIT), sides $sides"
          echo "sides=$sides" >> "$GITHUB_OUTPUT"

  emulator-logcat:
    needs: plan
    # ubuntu-latest of the upstream repository (T-272)
    runs-on: ubuntu-26.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        api: ${{ fromJSON(inputs.apis) }}
        side: ${{ fromJSON(needs.plan.outputs.sides) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: fdroid-android-trial
          path: apk-head
          run-id: ${{ inputs.head }}
          github-token: ${{ github.token }}

      - name: Download the APK before the change
        if: ${{ inputs.base != '' }}
        uses: actions/download-artifact@v4
        with:
          name: fdroid-android-trial
          path: apk-base
          run-id: ${{ inputs.base }}
          github-token: ${{ github.token }}

      - name: Setup Java for Android Emulator
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run the scenario and record logcat
        # A step stuck on adb ends here, and the evidence is still uploaded
        timeout-minutes: 48
        uses: ReactiveCircus/android-emulator-runner@v2
        env:
          LOG_DEBUG: ${{ inputs.log_debug }}
          EMU_CASES: ${{ inputs.cases }}
          EMU_SIDE: ${{ matrix.side }}
        # no `cores:` - the default 2 of the action on purpose (T-660): 4 of the 4 vCPU of the runner gave a case
        # only ~10 %, and the load after the boot was no cause of the ANR (waiting for it did not help)
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: bash .github/emu.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat-${{ inputs.head }}-api${{ matrix.api }}${{ matrix.side != 'both' && format('-{0}', matrix.side) || '' }}${{ (inputs.cases != '' || inputs.base == '' || inputs.apis != '[30, 35]') && '-part' || '' }}
          path: |
            *.png
            raw-?c-*
            full_logcat.txt
            steps.log
            dumps/
            drv/
          if-no-files-found: warn
