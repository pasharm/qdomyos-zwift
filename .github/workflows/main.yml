# test branch (T-046): the modern look of feat/modern-ui on the iOS simulator. Built the way
# Xcode Cloud builds the App Store app (T-281: build-qdomyos-zwift-Qt_5_15_2_for_iOS-Debug/ci_scripts,
# the committed Xcode project, Release), then walked page by page (.github/ios_modern.py, idb) in
# every theme of "themes" at the default text size and once more at "big_size", with frames.
# With app_run the build is skipped and the .app comes from the ios-cloud-sim artifact of that run.
# T-293 (test/t293-ios): the system bars of the modern look, a short walk by default
name: CI

on:
  workflow_dispatch:
    inputs:
      app_run:
        description: run id whose ios-cloud-sim artifact has the .app (empty = build it)
        required: false
        default: ''
      themes:
        description: walks at the default text size, space separated, each ui_theme_mode-system appearance (T-293)
        required: false
        default: 'light-dark dark-light auto-light auto-dark'
      big_size:
        description: Larger Text of one more walk in the first theme (simctl ui content_size; empty = none)
        required: false
        default: ''
      walk:
        description: short (T-293, home, settings, editor, the system appearance switched) or full
        required: false
        default: 'short'
      wait:
        description: seconds after a start before the frame
        required: false
        default: '45'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-cloud-sim:
    runs-on: macos-26
    timeout-minutes: 150
    env:
      BUILD: ${{ inputs.app_run == '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.BUILD == 'true'
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        if: env.BUILD != 'true'
        with:
          sparse-checkout: .github

      - name: Xcode
        run: |
          ls -d /Applications/Xcode*.app
          # the newest Xcode; the scripts of Xcode Cloud use /Applications/Xcode.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          echo "newest: $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          if [ "$(readlink -f /Applications/Xcode.app)" != "$(readlink -f "$XC")" ]; then
            sudo rm -rf /Applications/Xcode.app
            sudo ln -s "$XC" /Applications/Xcode.app
          fi
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Xcode Cloud scripts (ci_post_clone.sh, ci_pre_xcodebuild.sh)
        if: env.BUILD == 'true'
        run: |
          # what Xcode Cloud gives the scripts: the repository path and /Volumes/workspace/repository
          export CI_PRIMARY_REPOSITORY_PATH="$GITHUB_WORKSPACE"
          echo "CI_PRIMARY_REPOSITORY_PATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          sudo mkdir -p /Volumes/workspace
          sudo ln -sfn "$GITHUB_WORKSPACE" /Volumes/workspace/repository
          cd build-qdomyos-zwift-Qt_5_15_2_for_iOS-Debug/ci_scripts
          bash ci_post_clone.sh
          bash ci_pre_xcodebuild.sh

      - name: xcodebuild for the simulator (Release, the committed project)
        if: env.BUILD == 'true'
        run: |
          set -o pipefail
          mkdir -p out
          # the WatchKit 2 app has no product types for the iOS simulator: the app is built without it
          python3 .github/scripts/ios_simulator_project.py build-qdomyos-zwift-Qt_5_15_2_for_iOS-Debug/qdomyoszwift.xcodeproj/project.pbxproj
          # T-046, test only: UiIcon.qml of the modern look imports QtQuick.Shapes, qmake puts its static
          # plugin into qml_plugin_import.cpp, but the committed project does not link it (run 40289368702:
          # undefined qt_static_plugin_QmlShapesPlugin). Linked here to see the look past that
          # QZ_QT_ROOT of the Xcode Cloud scripts (the -L paths of run 40289368702)
          ls -l /tmp/Qt-5.15.2/ios/qml/QtQuick/Shapes /tmp/Qt-5.15.2/ios/lib/libQt5QuickShapes.a || true
          python3 .github/ios_link_shapes.py build-qdomyos-zwift-Qt_5_15_2_for_iOS-Debug/qdomyoszwift.xcodeproj/project.pbxproj
          # Qt of the App Store build has x86_64 (simulator) and arm64 (device) slices
          xcodebuild -project src/qdomyoszwift.xcodeproj -scheme qdomyoszwift -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath dd \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee out/xcodebuild.log | grep -E "error:|warning: .*(Qt|qml)|BUILD (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "BUILD SUCCEEDED" out/xcodebuild.log

      - name: The .app of an earlier run
        if: env.BUILD != 'true'
        uses: actions/download-artifact@v4
        with:
          name: ios-cloud-sim
          path: prev
          run-id: ${{ inputs.app_run }}
          github-token: ${{ github.token }}

      - name: Find the app
        id: app
        run: |
          mkdir -p out
          if [ "$BUILD" = "true" ]; then
            APP=$(find dd/Build/Products -maxdepth 2 -name '*.app' -type d -path '*iphonesimulator*' | grep -v -i watch | head -n 1)
          else
            mkdir -p appdir && ditto -x -k prev/app.zip appdir
            APP=$(find appdir -maxdepth 1 -name '*.app' -type d | head -n 1)
          fi
          echo "app: $APP"
          test -n "$APP"
          PL="$APP/Info.plist"
          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PL")
          EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PL")
          echo "bundle id: $BID, executable: $EXE"
          echo "CFBundleVersion: '$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PL" 2>&1)'"
          file "$APP/$EXE"
          if [ "$BUILD" = "true" ]; then ditto -c -k --keepParent "$APP" out/app.zip; else cp prev/app.zip out/app.zip; fi
          V=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PL" 2>/dev/null || true)
          case "$V" in ''|*'$'*) /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 1' "$PL" 2>/dev/null || /usr/libexec/PlistBuddy -c 'Add :CFBundleVersion string 1' "$PL" ;; esac
          codesign --force --deep --sign - "$APP"
          echo "app=$APP" >> $GITHUB_OUTPUT
          echo "bid=$BID" >> $GITHUB_OUTPUT

      - name: Rosetta (the simulator slice of Qt 5.15.2 is x86_64)
        run: softwareupdate --install-rosetta --agree-to-license || true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: idb (taps and the accessibility tree)
        run: |
          brew install facebook/fb/idb-companion || true
          if ! command -v idb_companion; then
            curl -sSL -o idb.tar.gz https://github.com/facebook/idb/releases/download/v1.1.8/idb-companion.universal.tar.gz
            sudo mkdir -p /usr/local/opt /usr/local/bin
            sudo tar -xzf idb.tar.gz -C /usr/local/opt
            sudo ln -sf /usr/local/opt/idb-companion.universal/bin/idb_companion /usr/local/bin/idb_companion
          fi
          idb_companion --version || true
          python -m pip install fb-idb || true
          echo "IDB=$(python -c 'import shutil; print(shutil.which("idb") or "idb")')" >> $GITHUB_ENV

      - name: Run on a simulator
        env:
          APP: ${{ steps.app.outputs.app }}
          BID: ${{ steps.app.outputs.bid }}
          THEMES: ${{ inputs.themes }}
          BIG_SIZE: ${{ inputs.big_size }}
          WAIT: ${{ inputs.wait }}
          WALK: ${{ inputs.walk }}
        run: |
          set -x
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          for rt in sorted(d, reverse=True):
              if "iOS" not in rt:
                  continue
              for dev in d[rt]:
                  if dev["name"].startswith("iPhone"):
                      print(dev["udid"]); sys.exit()
          ')
          echo "device: $UDID"
          test -n "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          # QSettings on iOS = CFPreferences "com.<organizationDomain, dots as dashes>.<applicationName>" (main.cpp),
          # in the app container; a last device closes the first-run wizard (homeform::firstRun)
          QSD=com.robertoviola-cloud.qDomyos-Zwift
          # one walk: a clean install (the settings file is written before the first start, so the
          # cached preferences of a running app cannot overwrite it), theme $2, text size $3
          walk() {
            NAME=$1
            # T-293: "light-dark" = ui_theme_mode light with the system in dark; switched to the
            # other appearance during the short walk
            MODE=${2%%-*}
            SYS=${2#*-}
            [ "$SYS" != "$2" ] || SYS=light
            if [ "$SYS" = dark ]; then export SWITCH_TO=light; else export SWITCH_TO=dark; fi
            xcrun simctl ui "$UDID" appearance "$SYS"
            xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true
            xcrun simctl uninstall "$UDID" "$BID" 2>/dev/null || true
            xcrun simctl install "$UDID" "$APP"
            xcrun simctl ui "$UDID" content_size "$3"
            echo "$NAME: theme $MODE, system $(xcrun simctl ui "$UDID" appearance 2>&1), content size $(xcrun simctl ui "$UDID" content_size 2>&1)" >> out/walks.txt
            DATA=$(xcrun simctl get_app_container "$UDID" "$BID" data)
            mkdir -p "$DATA/Library/Preferences"
            PREFS="$DATA/Library/Preferences/$QSD.plist"
            /usr/libexec/PlistBuddy -c 'Add :bluetooth_lastdevice_name string TestBike' "$PREFS"
            /usr/libexec/PlistBuddy -c 'Add :applewatch_fakedevice bool true' "$PREFS"
            /usr/libexec/PlistBuddy -c 'Add :log_debug bool true' "$PREFS"
            /usr/libexec/PlistBuddy -c 'Add :ui_modern bool true' "$PREFS"
            /usr/libexec/PlistBuddy -c "Add :ui_theme_mode string $MODE" "$PREFS"
            plutil -p "$PREFS" > "out/$NAME-prefs-before.txt" 2>&1 || true
            xcrun simctl launch --stdout="$PWD/out/$NAME.stdout.txt" --stderr="$PWD/out/$NAME.stderr.txt" "$UDID" "$BID" || echo "launch failed: $?"
            sleep "$WAIT"
            xcrun simctl spawn "$UDID" launchctl list | grep -i "$BID" || echo "$NAME: app not running after $WAIT s" | tee -a out/walks.txt
            python .github/ios_modern.py "$IDB" "$UDID" out "$NAME" > "out/$NAME.nav.txt" 2>&1 || echo "$NAME: walk failed" >> out/walks.txt
            xcrun simctl spawn "$UDID" launchctl list | grep -i "$BID" || echo "$NAME: app not running after the walk" | tee -a out/walks.txt
            grep -a "qrc:/" "out/$NAME.stderr.txt" | sort | uniq -c | sort -rn > "out/$NAME-qml-warnings.txt" || true
            grep -a "T293" "out/$NAME.stderr.txt" "out/$NAME.stdout.txt" > "out/$NAME-t293.txt" || true
            for f in "$DATA"/Library/Preferences/*.plist; do echo "== $f"; plutil -p "$f"; done > "out/$NAME-prefs-after.txt" 2>&1 || true
            mkdir -p "out/$NAME-logs"
            find "$DATA" -name "debug-*.log" -exec cp {} "out/$NAME-logs/" \; || true
          }
          N=0
          FIRST=""
          for T in $THEMES; do
            N=$((N + 1))
            [ -n "$FIRST" ] || FIRST=$T
            walk "w$N-$T" "$T" large
          done
          if [ -n "$BIG_SIZE" ]; then
            N=$((N + 1))
            walk "w$N-${FIRST:-dark}-big" "${FIRST:-dark}" "$BIG_SIZE"
          fi
          ls ~/Library/Logs/DiagnosticReports/ > out/crash-list.txt 2>&1 || true
          cp ~/Library/Logs/DiagnosticReports/*qdomyos* out/ 2>/dev/null || true

      - name: Keep the output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-cloud-sim
          path: out/
