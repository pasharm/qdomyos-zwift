# test branch (T-211, scenario from T-426): run two APKs that were already built on one emulator - the build with the
# fix (source) and the build of the same master without it (baseline) - and keep the frames of
# the settings search results with miles on, in English and Russian, logcat and steps.log (no build).
name: CI

on:
  workflow_dispatch:
    inputs:
      source:
        description: run id of the build with the fix (fdroid-android-trial)
        required: true
      baseline:
        description: run id of the build without it (fdroid-android-trial)
        required: true

jobs:
  emulator-logcat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download the APK with the fix
        uses: actions/download-artifact@v4
        with:
          name: fdroid-android-trial
          path: apk-debug
          run-id: ${{ inputs.source }}
          github-token: ${{ github.token }}

      - name: Download the APK without it
        uses: actions/download-artifact@v4
        with:
          name: fdroid-android-trial
          path: apk-base
          run-id: ${{ inputs.baseline }}
          github-token: ${{ github.token }}

      - name: Setup Java for Android Emulator
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Search results in the units of their page, before and after
        timeout-minutes: 25
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: bash .github/emu.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat-${{ inputs.source }}-vs-${{ inputs.baseline }}
          path: |
            *.png
            full_logcat.txt
            steps.log
            dumps/
          if-no-files-found: warn
