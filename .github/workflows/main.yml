# test branch: run an APK that was already built on one emulator and keep logcat and
# screenshots (no build). The source run id is below.
name: CI

on:
  workflow_dispatch:
    inputs:
      source:
        description: run id of the build to test
        required: true
      modern:
        description: ui_modern for the run (false = the classic look, for comparison)
        required: false
        default: 'false'
      log_debug:
        description: log_debug for the run (false = the debug log off)
        required: false
        default: 'true'
      phone:
        description: uk = the user's phone - Ukrainian locale, OnePlus 12 screen (empty = English, Nexus 6)
        required: false
        default: ''
      talkback:
        description: TalkBack - stock (the image's Google TalkBack) or a run id of the TalkBack workflow; empty = no TalkBack, the driver's actions
        required: false
        default: ''

jobs:
  emulator-logcat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK from the build run
        uses: actions/download-artifact@v4
        with:
          name: fdroid-android-trial
          path: apk-debug
          run-id: ${{ inputs.source }}
          github-token: ${{ github.token }}

      - name: Download TalkBack
        if: inputs.talkback != '' && inputs.talkback != 'stock'
        uses: actions/download-artifact@v4
        with:
          name: talkback-apk
          path: tb
          run-id: ${{ inputs.talkback }}
          github-token: ${{ github.token }}

      - name: Setup Java for Android Emulator
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Start the app and record logcat
        uses: ReactiveCircus/android-emulator-runner@v2
        env:
          UI_MODERN: ${{ inputs.modern }}
          LOG_DEBUG: ${{ inputs.log_debug }}
          TALKBACK: ${{ inputs.talkback }}
          PHONE: ${{ inputs.phone }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          # a ready Google TalkBack replaces the image's own (another signature): system writable
          emulator-options: ${{ inputs.talkback != '' && inputs.talkback != 'stock' && '-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -writable-system' || '-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim' }}
          script: bash .github/emu.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat-${{ inputs.source }}-${{ inputs.modern }}${{ inputs.log_debug == 'false' && '-nolog' || '' }}${{ inputs.talkback != '' && '-talkback' || '' }}
          path: |
            screenshot.png
            *.png
            process_list.txt
            full_logcat.txt
            steps.log
            a11y.txt
            tb-speech.txt
            tb_logcat.txt
            dumps/
            drv/
            qz-logs/
          if-no-files-found: warn
