# emu-lib: tools/emu/workflow.yml sha 902e23f65e81 - edit there, then tools/emu/sync.py (T-505)
# Test only: the emulator scenario .github/emu.sh of an emu branch on the APK of two builds (T-505, T-534).
# One source: tools/emu/workflow.yml of the work folder; `tools/emu/sync.py wt/<name> --workflow` writes it as
# .github/workflows/main.yml of the branch. A task input of its own (PAGES of test/t495-emu): edit the copy -
# sync then keeps it (edited) and says so.
#
# A full run: head and base, cases and apis by default. An intermediate run after a fix (T-534): only the new
# cases (cases), one API (apis: [30]), no side before (base empty) - minutes instead of 20-30; the run says
# "== partial run" in steps.log and its artifact ends in -part. The last run before the beta and a PR is a
# full one (qz-ci-build).
name: CI
run-name: emu ${{ inputs.cases || 'all cases' }}, API ${{ inputs.apis }}${{ inputs.base == '' && ', no base' || '' }}

on:
  workflow_dispatch:
    inputs:
      head:
        description: run id of the build after the change, with the fdroid-android-trial artifact
        required: true
      base:
        description: run id of the build before the change (fdroid-android-trial); empty - no side before
        required: false
        default: ''
      cases:
        description: "cases of emu.sh: globs of <case> or <function>/<case>, by spaces or commas (landopen/hc); empty - all"
        required: false
        default: ''
      apis:
        description: API levels, a JSON list ([30] for an intermediate run)
        required: false
        default: '[30, 35]'
      log_debug:
        description: log_debug for the run
        required: false
        default: 'true'

jobs:
  emulator-logcat:
    # ubuntu-latest of the upstream repository (T-272)
    runs-on: ubuntu-26.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        api: ${{ fromJSON(inputs.apis) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: fdroid-android-trial
          path: apk-head
          run-id: ${{ inputs.head }}
          github-token: ${{ github.token }}

      - name: Download the APK before the change
        if: ${{ inputs.base != '' }}
        uses: actions/download-artifact@v4
        with:
          name: fdroid-android-trial
          path: apk-base
          run-id: ${{ inputs.base }}
          github-token: ${{ github.token }}

      - name: Setup Java for Android Emulator
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run the scenario and record logcat
        # A step stuck on adb ends here, and the evidence is still uploaded
        timeout-minutes: 48
        uses: ReactiveCircus/android-emulator-runner@v2
        env:
          LOG_DEBUG: ${{ inputs.log_debug }}
          EMU_CASES: ${{ inputs.cases }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: bash .github/emu.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat-${{ inputs.head }}-api${{ matrix.api }}${{ (inputs.cases != '' || inputs.base == '' || inputs.apis != '[30, 35]') && '-part' || '' }}
          path: |
            *.png
            raw-?c-*
            full_logcat.txt
            steps.log
            dumps/
            drv/
          if-no-files-found: warn
