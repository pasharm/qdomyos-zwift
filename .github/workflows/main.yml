# test branch (T-084): the automatic appearance of the modern look on Android 7, 9 and 14.
# Runs two APKs that were already built (no build): the reference and the fix, keeps the
# screenshots, the brightness of each frame and logcat.
name: CI

on:
  workflow_dispatch:
    inputs:
      source:
        description: run id of the build to test (the fix)
        required: true
      baseline:
        description: run id of the reference build (without the fix)
        required: true

jobs:
  emulator-theme:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 24
            target: default
          - api-level: 28
            target: default
          - api-level: 34
            target: google_apis
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK from the build run
        uses: actions/download-artifact@v4
        with:
          name: fdroid-android-trial
          path: apk-debug
          run-id: ${{ inputs.source }}
          github-token: ${{ github.token }}

      - name: Download the reference APK
        uses: actions/download-artifact@v4
        with:
          name: fdroid-android-trial
          path: apk-base
          run-id: ${{ inputs.baseline }}
          github-token: ${{ github.token }}

      - name: Python with Pillow (brightness of the frames)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install pillow

      - name: Setup Java for Android Emulator
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Theme scenario on the emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: bash .github/emu.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-theme-api${{ matrix.api-level }}
          path: |
            *.png
            full_logcat.txt
            steps.log
            dumps/
          if-no-files-found: warn
