# test branch (T-270): build for the iOS simulator as the upstream ios-build job does, then run the
# app on a simulator and keep frames, the app output and the .app (no device, no secrets)
name: CI

on:
  workflow_dispatch:
    inputs:
      big_size:
        description: Dynamic Type of the second start (simctl ui content_size)
        required: false
        default: 'extra-extra-extra-large'
      wait:
        description: seconds after a start before the frame
        required: false
        default: '45'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-sim:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Checkout submodule repo
        uses: actions/checkout@v4
        with:
          repository: bluetiger9/SmtpClient-for-Qt
          path: "src/smtpclient/"
          ref: 3fa4a0fe5797070339422cf18b5e9ed8dcb91f9c
      - name: Checkout googletest
        uses: actions/checkout@v4
        with:
          repository: google/googletest
          path: "tst/googletest/"
          ref: "release-1.12.1"

      - name: Install Qt iOS
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          host: 'mac'
          target: 'ios'
          modules: 'qtcharts  qtnetworkauth'
          dir: '${{ github.workspace }}/output/ios/'
          cache: 'true'
          cache-key-prefix: 'install-qt-action-ios'

      - name: fix qt
        run: find ${{ github.workspace }}/output/ios/ -name 'ios.conf' -exec sed -i '' 's/ios-simulator/iphonesimulator/g' {} \;
      - name: fix qt
        run: find ${{ github.workspace }}/output/ios/ -name 'devices.py' -exec sed -i '' 's/\/usr\/bin\/python/\/usr\/bin\/python3/g' {} \;
      - name: fix qt
        run: find ./ -name 'qdomyos-zwift-lib.pro' -exec sed -i '' 's/TARGET = qdomyos-zwift/TARGET = qdomyoszwift/g' {} \;
      - name: patching qt for bluetooth
        run: cp qt-patches/ios/5.15.2/binary/*.* ${{ github.workspace }}/output/ios/Qt/5.15.2/ios/lib/

      - name: Build
        run: |
          cd src
          for k in STRAVA_SECRET_KEY PELOTON_SECRET_KEY SMTP_USERNAME SMTP_PASSWORD SMTP_SERVER INTERVALSICU_CLIENT_ID INTERVALSICU_CLIENT_SECRET; do
            echo "#define $k " >> secret.h
          done
          cd ..
          qmake CONFIG+=debug CONFIG+=iphonesimulator && make -j4

      - name: Find the app
        id: app
        run: |
          APP=$(find . -name '*.app' -type d -path '*iphonesimulator*' | grep -v '/output/' | head -n 1)
          echo "app: $APP"
          test -n "$APP"
          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          echo "bundle id: $BID, executable: $EXE"
          file "$APP/$EXE"
          lipo -archs "$APP/$EXE" || true
          echo "app=$APP" >> $GITHUB_OUTPUT
          echo "bid=$BID" >> $GITHUB_OUTPUT
          mkdir -p out
          ditto -c -k --keepParent "$APP" out/app.zip

      - name: Rosetta (the app of Qt 5.15.2 is x86_64)
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Run on a simulator
        env:
          APP: ${{ steps.app.outputs.app }}
          BID: ${{ steps.app.outputs.bid }}
          BIG: ${{ inputs.big_size }}
          WAIT: ${{ inputs.wait }}
        run: |
          set -x
          xcodebuild -version
          xcrun simctl list runtimes
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          for rt in sorted(d, reverse=True):
              if "iOS" not in rt:
                  continue
              for dev in d[rt]:
                  if dev["name"].startswith("iPhone"):
                      print(dev["udid"]); sys.exit()
          ')
          echo "device: $UDID"
          test -n "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          shoot() {
            xcrun simctl launch --terminate-running-process --stdout="out/$1.stdout.txt" --stderr="out/$1.stderr.txt" "$UDID" "$BID" || echo "launch failed: $?"
            sleep "$WAIT"
            xcrun simctl io "$UDID" screenshot "out/$1.png" || true
            xcrun simctl spawn "$UDID" launchctl list | grep -i "$BID" || echo "app not running after $WAIT s"
          }
          xcrun simctl ui "$UDID" content_size large
          shoot 01-default
          xcrun simctl ui "$UDID" content_size "$BIG"
          shoot 02-big
          xcrun simctl spawn "$UDID" log show --last 5m --style compact --predicate "process CONTAINS[c] 'qdomyos'" > out/syslog.txt 2>&1 || true
          ls ~/Library/Logs/DiagnosticReports/ > out/crash-list.txt 2>&1 || true
          cp ~/Library/Logs/DiagnosticReports/*qdomyos* out/ 2>/dev/null || true

      - name: Keep the output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-sim
          path: out/
