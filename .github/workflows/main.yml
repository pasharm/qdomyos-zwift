# test branch: run an APK that was already built on one emulator and keep logcat, the sound of
# the emulator and the WAV files of the speech probe (T-246, no build). The source run id is below.
name: CI

on:
  workflow_dispatch:
    inputs:
      source:
        description: run id of the build to test
        required: true
      scenario:
        description: full = app ru, app uk, then system ru; short = app ru only
        required: false
        default: 'full'

jobs:
  emulator-tts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pa = the sound of the emulator into a PulseAudio null sink, recorded per case;
        # none = the usual run without sound, in case the emulator does not boot with it
        audio: [pa, none]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: PulseAudio null sink
        if: matrix.audio == 'pa'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pulseaudio pulseaudio-utils
          pulseaudio -D --exit-idle-time=-1 --system=false
          pactl load-module module-null-sink sink_name=qzsink
          pactl set-default-sink qzsink
          pactl info
          echo "PULSE_SERVER=unix:$(pactl info | grep 'Server String' | cut -d' ' -f3)" >> $GITHUB_ENV

      - name: Download APK from the build run
        uses: actions/download-artifact@v4
        with:
          name: fdroid-android-trial
          path: apk-debug
          run-id: ${{ inputs.source }}
          github-token: ${{ github.token }}

      - name: Setup Java for Android Emulator
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Start the app and record logcat
        uses: ReactiveCircus/android-emulator-runner@v2
        env:
          SCENARIO: ${{ inputs.scenario }}
          AUDIO: ${{ matrix.audio }}
          # run 39510421044 recorded silence: the emulator did not pick PulseAudio by itself
          QEMU_AUDIO_DRV: ${{ matrix.audio == 'pa' && 'pa' || 'none' }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          emulator-options: ${{ matrix.audio == 'pa' && '-no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim' || '-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim' }}
          script: bash .github/emu.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-tts-${{ inputs.source }}-${{ matrix.audio }}
          path: |
            *.png
            process_list.txt
            full_logcat.txt
            steps.log
            t246-*/
            audio-*.wav
            qz-logs/
          if-no-files-found: warn
