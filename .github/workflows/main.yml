# Test only (T-552): build QZ for the iOS simulator as Xcode Cloud does (the job of T-528, workflow of T-537), with
# the fake heart rate sensors of T-473 (t473_fake_sensors: two sensors 30 s and 45 s after homeform starts), then the
# heart rate sensor bar and its list: modern dark, modern light, classic - frames and checks (ios_t552.py). Head only
# (feat/modern-ui + the change of T-552 + the hook); the QML lines of HeartRateSuggestion.qml go to qml-t552-<case>.txt.
# With app_run the build is skipped and the .app comes from the ios-cloud-sim artifact of that run
name: CI

on:
  workflow_dispatch:
    inputs:
      app_run:
        description: run id whose ios-cloud-sim artifact has the .app (empty = build it)
        required: false
        default: ''
      side:
        description: head (the change of T-552 + the hook) - the prefix of the frames; base is not set up for T-552
        required: true
        default: head
      base_sha:
        description: the master commit whose src/ the base side builds (the branch differs from it in src/ only)
        required: false
        default: 284623b76aa2343997390d889e0dae24d5a7a3a8
      wait:
        description: seconds after a start before the frame
        required: false
        default: '45'

concurrency:
  # one branch for both sides (base and head run side by side)
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.side }}
  cancel-in-progress: true

jobs:
  ios-cloud-sim:
    runs-on: macos-15-intel
    timeout-minutes: 150
    env:
      BUILD: ${{ inputs.app_run == '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.BUILD == 'true'
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        if: env.BUILD != 'true'
        with:
          sparse-checkout: .github

      - name: Base side - src/ of master (the test commit keeps .github)
        if: env.BUILD == 'true' && inputs.side == 'base'
        env:
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          git fetch --depth 1 origin "$BASE_SHA"
          git checkout FETCH_HEAD -- src/
          git diff --stat HEAD -- src/
          # only the QML files of the PR may differ from the branch
          git diff --name-only FETCH_HEAD -- src/ | tee base-left.txt
          test ! -s base-left.txt

      - name: Xcode
        run: |
          ls -d /Applications/Xcode*.app
          # the newest Xcode; the scripts of Xcode Cloud use /Applications/Xcode.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          echo "newest: $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          if [ "$(readlink -f /Applications/Xcode.app)" != "$(readlink -f "$XC")" ]; then
            sudo rm -rf /Applications/Xcode.app
            sudo ln -s "$XC" /Applications/Xcode.app
          fi
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Xcode Cloud scripts (ci_post_clone.sh, ci_pre_xcodebuild.sh)
        if: env.BUILD == 'true'
        run: |
          # what Xcode Cloud gives the scripts: the repository path and /Volumes/workspace/repository
          export CI_PRIMARY_REPOSITORY_PATH="$GITHUB_WORKSPACE"
          echo "CI_PRIMARY_REPOSITORY_PATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          sudo mkdir -p /Volumes/workspace
          sudo ln -sfn "$GITHUB_WORKSPACE" /Volumes/workspace/repository
          cd build-qdomyos-zwift-Qt_5_15_2_for_iOS-Debug/ci_scripts
          bash ci_post_clone.sh
          bash ci_pre_xcodebuild.sh

      - name: xcodebuild for the simulator (Release, the committed project)
        if: env.BUILD == 'true'
        run: |
          mkdir -p out
          bash .github/scripts/build_ios_simulator.sh out/xcodebuild.log

      - name: The .app of an earlier run
        if: env.BUILD != 'true'
        uses: actions/download-artifact@v4
        with:
          name: ios-cloud-sim
          path: prev
          run-id: ${{ inputs.app_run }}
          github-token: ${{ github.token }}

      - name: Find the app
        id: app
        run: |
          mkdir -p out
          if [ "$BUILD" = "true" ]; then
            APP=$(find dd/Build/Products -maxdepth 2 -name '*.app' -type d -path '*iphonesimulator*' | grep -v -i watch | head -n 1)
          else
            mkdir -p appdir && ditto -x -k prev/app.zip appdir
            APP=$(find appdir -maxdepth 1 -name '*.app' -type d | head -n 1)
          fi
          echo "app: $APP"
          test -n "$APP"
          PL="$APP/Info.plist"
          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PL")
          EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PL")
          echo "bundle id: $BID, executable: $EXE"
          echo "CFBundleVersion: '$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PL" 2>&1)'"
          file "$APP/$EXE"
          if [ "$BUILD" = "true" ]; then ditto -c -k --keepParent "$APP" out/app.zip; else cp prev/app.zip out/app.zip; fi
          V=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PL" 2>/dev/null || true)
          case "$V" in ''|*'$'*) /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 1' "$PL" 2>/dev/null || /usr/libexec/PlistBuddy -c 'Add :CFBundleVersion string 1' "$PL" ;; esac
          codesign --force --deep --sign - "$APP"
          echo "app=$APP" >> $GITHUB_OUTPUT
          echo "bid=$BID" >> $GITHUB_OUTPUT

      - name: Rosetta (the simulator slice of Qt 5.15.2 is x86_64)
        run: softwareupdate --install-rosetta --agree-to-license || true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: idb (taps and the accessibility tree)
        run: |
          if ! command -v idb_companion; then
            curl -sSL -o idb.tar.gz https://github.com/facebook/idb/releases/download/v1.1.8/idb-companion.universal.tar.gz
            sudo mkdir -p /usr/local/opt /usr/local/bin
            sudo tar -xzf idb.tar.gz -C /usr/local/opt
            sudo ln -sf /usr/local/opt/idb-companion.universal/bin/idb_companion /usr/local/bin/idb_companion
          fi
          idb_companion --version || true
          python -m pip install fb-idb || true
          echo "IDB=$(python -c 'import shutil; print(shutil.which("idb") or "idb")')" >> $GITHUB_ENV

      - name: Run on a simulator
        env:
          APP: ${{ steps.app.outputs.app }}
          BID: ${{ steps.app.outputs.bid }}
          SIDE: ${{ inputs.side }}
          WAIT: ${{ inputs.wait }}
        run: |
          set -x
          mkdir -p out
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          for rt in sorted(d, reverse=True):
              if "iOS" not in rt:
                  continue
              for dev in d[rt]:
                  if dev["name"].startswith("iPhone"):
                      print(dev["udid"]); sys.exit()
          ')
          echo "device: $UDID"
          test -n "$UDID"
          # T-510: the on-screen keyboard as on a phone - the simulator connects the Mac keyboard as a
          # hardware one by default and then shows no keyboard on the screen
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          /usr/libexec/PlistBuddy -c "Add :DevicePreferences:$UDID:ConnectHardwareKeyboard bool false" ~/Library/Preferences/com.apple.iphonesimulator.plist || \
            /usr/libexec/PlistBuddy -c "Set :DevicePreferences:$UDID:ConnectHardwareKeyboard false" ~/Library/Preferences/com.apple.iphonesimulator.plist || true
          defaults read com.apple.iphonesimulator > out/simulator-prefs.txt 2>&1 || true
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          QSD=com.robertoviola-cloud.qDomyos-Zwift
          FAIL=0
          xcrun simctl ui "$UDID" appearance light
          # each case from a clean install: the settings before the first start. Cases <name>:<ui_modern>:<theme>:<language>
          # md - modern dark Ukrainian, ml - modern light Ukrainian, c - classic English (as on Android, notes/emu/t552-*)
          for CASE in md:true:dark:uk ml:true:light:uk c:false:light:en; do
            IFS=: read -r LOOK MODERN THEME LANG_ <<< "$CASE"
            xcrun simctl uninstall "$UDID" "$BID" || true
            xcrun simctl install "$UDID" "$APP"
            # QSettings on iOS = CFPreferences "com.<organizationDomain, dots as dashes>.<applicationName>" (main.cpp),
            # in the app container; a last device closes the first-run wizard (homeform::firstRun). A fake treadmill,
            # not the fake bike of T-537: its heart rate stays 0, so the bar is offered (homeform::heartRateSensorFound)
            DATA=$(xcrun simctl get_app_container "$UDID" "$BID" data)
            mkdir -p "$DATA/Library/Preferences"
            PREFS="$DATA/Library/Preferences/$QSD.plist"
            /usr/libexec/PlistBuddy -c 'Add :bluetooth_lastdevice_name string TestTreadmill' "$PREFS"
            /usr/libexec/PlistBuddy -c 'Add :fakedevice_treadmill bool true' "$PREFS"
            /usr/libexec/PlistBuddy -c 'Add :log_debug bool true' "$PREFS"
            /usr/libexec/PlistBuddy -c "Add :ui_modern bool $MODERN" "$PREFS"
            /usr/libexec/PlistBuddy -c "Add :ui_theme_mode string $THEME" "$PREFS"
            /usr/libexec/PlistBuddy -c "Add :app_language string $LANG_" "$PREFS"
            /usr/libexec/PlistBuddy -c 'Add :heart_rate_belt_suggest bool true' "$PREFS"
            /usr/libexec/PlistBuddy -c 'Add :t473_fake_sensors bool true' "$PREFS"
            plutil -p "$PREFS" > "out/defaults-$LOOK.txt" 2>&1 || true
            xcrun simctl launch --terminate-running-process --stdout="$PWD/out/$LOOK.stdout.txt" --stderr="$PWD/out/$LOOK.stderr.txt" "$UDID" "$BID" || echo "launch failed: $?"
            sleep "$WAIT"
            xcrun simctl spawn "$UDID" launchctl list | grep -i "$BID" || { echo "!! $LOOK: app not running"; FAIL=1; }
            # the notification question keeps the app inactive
            python .github/ios_alert.py "$IDB" "$UDID" > "out/$LOOK.alert.txt" 2>&1 || { echo "!! $LOOK: system question still open"; FAIL=1; }
            sleep 3
            # bash -e of the step: a failed walk must not end the step before the other case and the logs
            RC=0
            python .github/ios_t552.py "$IDB" "$UDID" out "$SIDE-$LOOK" "$LOOK" > "out/$LOOK.walk.txt" 2>&1 || RC=$?
            cat "out/$LOOK.walk.txt"
            [ "$RC" = 0 ] || { echo "!! $LOOK walk: code $RC (see $LOOK.walk.txt)"; FAIL=1; }
            mkdir -p "out/logs-$LOOK"
            find "$DATA" -name "debug-*.log" -exec cp {} "out/logs-$LOOK/" \; || true
          done
          xcrun simctl spawn "$UDID" log show --last 30m --style compact --predicate "process CONTAINS[c] 'qdomyos'" > out/syslog.txt 2>&1 || true
          ls ~/Library/Logs/DiagnosticReports/ > out/crash-list.txt 2>&1 || true
          cp ~/Library/Logs/DiagnosticReports/*qdomyos* out/ 2>/dev/null || true
          if grep -i -q qdomyos out/crash-list.txt; then echo "!! a crash report of QZ (crash-list.txt)"; FAIL=1; fi
          for LOOK in md ml c; do
            cat out/logs-$LOOK/debug-*.log 2>/dev/null | grep -a -i -E "qml|ReferenceError|TypeError|Unable to assign" | head -600 > "out/qml-log-$LOOK.txt" || true
            # without a debug log the QML check proves nothing
            if ! ls out/logs-$LOOK/debug-*.log > /dev/null 2>&1; then
              echo "!! $LOOK: no debug log - the QML check proves nothing"; FAIL=1
            fi
            # T-552: a warning of the changed file is red (Android: none on base and head, run 43590701420)
            cat out/logs-$LOOK/debug-*.log "out/$LOOK.stderr.txt" 2>/dev/null | grep -a -E "HeartRateSuggestion[.]qml:[0-9]" > "out/qml-t552-$LOOK.txt" || true
            echo "$LOOK: QML lines of the log $(wc -l < "out/qml-log-$LOOK.txt"), of HeartRateSuggestion.qml $(wc -l < "out/qml-t552-$LOOK.txt")"
            if [ -s "out/qml-t552-$LOOK.txt" ]; then cat "out/qml-t552-$LOOK.txt"; echo "!! $LOOK: QML warnings of HeartRateSuggestion.qml"; FAIL=1; fi
            # the fake sensors came: the hook writes these lines (homeform.cpp, test only)
            grep -a -c "T-473 test: fake sensor" out/logs-$LOOK/debug-*.log 2>/dev/null || echo "!! $LOOK: no fake sensor line in the debug log"
          done
          ls out/*.png
          exit $FAIL

      - name: Keep the output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-cloud-sim
          path: out/
