# test branch (T-281): build QZ for the iOS simulator the way Xcode Cloud builds the App Store app
# (build-qdomyos-zwift-Qt_5_15_2_for_iOS-Debug/ci_scripts, the committed Xcode project, Release),
# then run it on a simulator and keep frames, the debug log and the .app.
# With app_run the build is skipped and the .app comes from the ios-cloud-sim artifact of that run
name: CI

on:
  workflow_dispatch:
    inputs:
      app_run:
        description: run id whose ios-cloud-sim artifact has the .app (empty = build it)
        required: false
        default: ''
      language:
        description: label of the language to pick in the App Language list (empty = no taps)
        required: false
        default: 'Italian'
      wait:
        description: seconds after a start before the frame
        required: false
        default: '45'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-cloud-sim:
    runs-on: macos-26
    timeout-minutes: 150
    env:
      BUILD: ${{ inputs.app_run == '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.BUILD == 'true'
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        if: env.BUILD != 'true'
        with:
          sparse-checkout: .github

      - name: Xcode
        run: |
          ls -d /Applications/Xcode*.app
          # the newest Xcode; the scripts of Xcode Cloud use /Applications/Xcode.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          echo "newest: $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          if [ "$(readlink -f /Applications/Xcode.app)" != "$(readlink -f "$XC")" ]; then
            sudo rm -rf /Applications/Xcode.app
            sudo ln -s "$XC" /Applications/Xcode.app
          fi
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Xcode Cloud scripts (ci_post_clone.sh, ci_pre_xcodebuild.sh)
        if: env.BUILD == 'true'
        run: |
          # what Xcode Cloud gives the scripts: the repository path and /Volumes/workspace/repository
          export CI_PRIMARY_REPOSITORY_PATH="$GITHUB_WORKSPACE"
          echo "CI_PRIMARY_REPOSITORY_PATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          sudo mkdir -p /Volumes/workspace
          sudo ln -sfn "$GITHUB_WORKSPACE" /Volumes/workspace/repository
          cd build-qdomyos-zwift-Qt_5_15_2_for_iOS-Debug/ci_scripts
          bash ci_post_clone.sh
          bash ci_pre_xcodebuild.sh

      - name: xcodebuild for the simulator (Release, the committed project)
        if: env.BUILD == 'true'
        run: |
          set -o pipefail
          mkdir -p out
          # the WatchKit 2 app has no product types for the iOS simulator: the app is built without it
          python3 .github/scripts/ios_simulator_project.py build-qdomyos-zwift-Qt_5_15_2_for_iOS-Debug/qdomyoszwift.xcodeproj/project.pbxproj
          # Qt of the App Store build has x86_64 (simulator) and arm64 (device) slices
          xcodebuild -project src/qdomyoszwift.xcodeproj -scheme qdomyoszwift -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath dd \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee out/xcodebuild.log | grep -E "error:|warning: .*(Qt|qml)|BUILD (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "BUILD SUCCEEDED" out/xcodebuild.log

      - name: The .app of an earlier run
        if: env.BUILD != 'true'
        uses: actions/download-artifact@v4
        with:
          name: ios-cloud-sim
          path: prev
          run-id: ${{ inputs.app_run }}
          github-token: ${{ github.token }}

      - name: Find the app
        id: app
        run: |
          mkdir -p out
          if [ "$BUILD" = "true" ]; then
            APP=$(find dd/Build/Products -maxdepth 2 -name '*.app' -type d -path '*iphonesimulator*' | grep -v -i watch | head -n 1)
          else
            mkdir -p appdir && ditto -x -k prev/app.zip appdir
            APP=$(find appdir -maxdepth 1 -name '*.app' -type d | head -n 1)
          fi
          echo "app: $APP"
          test -n "$APP"
          PL="$APP/Info.plist"
          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PL")
          EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PL")
          echo "bundle id: $BID, executable: $EXE"
          echo "CFBundleVersion: '$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PL" 2>&1)'"
          file "$APP/$EXE"
          if [ "$BUILD" = "true" ]; then ditto -c -k --keepParent "$APP" out/app.zip; else cp prev/app.zip out/app.zip; fi
          V=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PL" 2>/dev/null || true)
          case "$V" in ''|*'$'*) /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 1' "$PL" 2>/dev/null || /usr/libexec/PlistBuddy -c 'Add :CFBundleVersion string 1' "$PL" ;; esac
          codesign --force --deep --sign - "$APP"
          echo "app=$APP" >> $GITHUB_OUTPUT
          echo "bid=$BID" >> $GITHUB_OUTPUT

      - name: Rosetta (the simulator slice of Qt 5.15.2 is x86_64)
        run: softwareupdate --install-rosetta --agree-to-license || true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: idb (taps and the accessibility tree)
        if: inputs.language != ''
        run: |
          brew install facebook/fb/idb-companion || true
          if ! command -v idb_companion; then
            curl -sSL -o idb.tar.gz https://github.com/facebook/idb/releases/download/v1.1.8/idb-companion.universal.tar.gz
            sudo mkdir -p /usr/local/opt /usr/local/bin
            sudo tar -xzf idb.tar.gz -C /usr/local/opt
            sudo ln -sf /usr/local/opt/idb-companion.universal/bin/idb_companion /usr/local/bin/idb_companion
          fi
          idb_companion --version || true
          python -m pip install fb-idb || true
          echo "IDB=$(python -c 'import shutil; print(shutil.which("idb") or "idb")')" >> $GITHUB_ENV

      - name: Run on a simulator
        env:
          APP: ${{ steps.app.outputs.app }}
          BID: ${{ steps.app.outputs.bid }}
          LANGUAGE: ${{ inputs.language }}
          WAIT: ${{ inputs.wait }}
        run: |
          set -x
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          for rt in sorted(d, reverse=True):
              if "iOS" not in rt:
                  continue
              for dev in d[rt]:
                  if dev["name"].startswith("iPhone"):
                      print(dev["udid"]); sys.exit()
          ')
          echo "device: $UDID"
          test -n "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          # QSettings on iOS = CFPreferences "com.<organizationDomain, dots as dashes>.<applicationName>" (main.cpp),
          # in the app container; a last device closes the first-run wizard (homeform::firstRun)
          QSD=com.robertoviola-cloud.qDomyos-Zwift
          DATA=$(xcrun simctl get_app_container "$UDID" "$BID" data)
          mkdir -p "$DATA/Library/Preferences"
          PREFS="$DATA/Library/Preferences/$QSD.plist"
          /usr/libexec/PlistBuddy -c 'Add :bluetooth_lastdevice_name string TestBike' "$PREFS" || true
          /usr/libexec/PlistBuddy -c 'Add :applewatch_fakedevice bool true' "$PREFS" || true
          /usr/libexec/PlistBuddy -c 'Add :log_debug bool true' "$PREFS" || true
          plutil -p "$PREFS" > out/defaults.txt 2>&1 || true
          start() {
            xcrun simctl launch --terminate-running-process --stdout="$PWD/out/$1.stdout.txt" --stderr="$PWD/out/$1.stderr.txt" "$UDID" "$BID" || echo "launch failed: $?"
            sleep "$WAIT"
            xcrun simctl spawn "$UDID" launchctl list | grep -i "$BID" || echo "app not running after $WAIT s"
          }
          start 01
          xcrun simctl io "$UDID" screenshot out/01-start.png || true
          if [ -n "$LANGUAGE" ]; then
            python .github/ios_lang.py "$IDB" "$UDID" out 01 "$LANGUAGE" > out/01.nav.txt 2>&1 || true
            plutil -p "$PREFS" | grep -i language > out/prefs-after-ok.txt 2>&1 || true
            start 02
            xcrun simctl io "$UDID" screenshot out/02-restart.png || true
          fi
          xcrun simctl spawn "$UDID" log show --last 15m --style compact --predicate "process CONTAINS[c] 'qdomyos'" > out/syslog.txt 2>&1 || true
          ls ~/Library/Logs/DiagnosticReports/ > out/crash-list.txt 2>&1 || true
          cp ~/Library/Logs/DiagnosticReports/*qdomyos* out/ 2>/dev/null || true
          find "$DATA" -name "debug-*.log" -exec cp {} out/ \; || true
          cat out/debug-*.log 2>/dev/null | grep -a -i -E "translation|language|qml" | head -400 > out/lang-log.txt || true
          for f in "$DATA"/Library/Preferences/*.plist; do echo "== $f"; plutil -p "$f" | head -40; done > out/prefs-after.txt 2>&1 || true

      - name: Keep the output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-cloud-sim
          path: out/
