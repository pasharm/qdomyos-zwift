# Test only (T-551): a stand-in for an iOS branch - its concurrency cancels runs in progress, like test/t550-ios.
# Started by hand it holds the branch busy; the start-ios job of a trim_ci.py --then-ios build must then refuse
# and leave this run alive.
name: CI

on:
  workflow_dispatch:
    inputs:
      side:
        description: base or head
        required: true
        default: head

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hold:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Hold the branch busy
        run: |
          echo "side=${{ inputs.side }}"
          sleep 1800
