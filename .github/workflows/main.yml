# test branch: run an APK that was already built on one emulator and keep logcat and
# screenshots (no build). The source run id is below.
name: CI

on:
  workflow_dispatch:
    inputs:
      source:
        description: run id of the build to test
        required: true
      modern:
        description: ui_modern for the run (false = the classic look, for comparison)
        required: false
        default: 'false'
      log_debug:
        description: log_debug for the run (false = the debug log off)
        required: false
        default: 'true'
      baseline:
        description: run id of the build to shoot first, as the reference (T-262)
        required: true
      scenario:
        description: full = all rounds, relaxed = only the switch "Relaxed Bluetooth" at 135 and 170 %
        required: false
        default: 'full'

jobs:
  emulator-logcat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK from the build run
        uses: actions/download-artifact@v4
        with:
          name: fdroid-android-trial
          path: apk-debug
          run-id: ${{ inputs.source }}
          github-token: ${{ github.token }}

      - name: Download the reference APK
        uses: actions/download-artifact@v4
        with:
          name: fdroid-android-trial
          path: apk-base
          run-id: ${{ inputs.baseline }}
          github-token: ${{ github.token }}

      - name: Setup Java for Android Emulator
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Start the app and record logcat
        uses: ReactiveCircus/android-emulator-runner@v2
        env:
          UI_MODERN: ${{ inputs.modern }}
          LOG_DEBUG: ${{ inputs.log_debug }}
          SCENARIO: ${{ inputs.scenario }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: bash .github/emu.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat-${{ inputs.source }}-${{ inputs.modern }}${{ inputs.log_debug == 'false' && '-nolog' || '' }}
          path: |
            screenshot.png
            *.png
            process_list.txt
            full_logcat.txt
            steps.log
            a11y.txt
            dumps/
            style-*.json
            qz-logs/
          if-no-files-found: warn
