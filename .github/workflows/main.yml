
# This is a basic workflow to help you get started with Actions

name: CI

env:
  DISPLAY: ':99'
  ACTIONS_ALLOW_UNSECURE_COMMANDS: 'true'

# Controls when the action will run. Triggers the workflow on push, pull request,
# scheduled nightly, or manual workflow dispatch events.
# test branch: ios-simulator-test only, manual trigger (trimmed from upstream main.yml)
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  ios-simulator-test:
    # Builds the app the way Xcode Cloud builds the App Store version (the scripts in
    # build-qdomyos-zwift-Qt_5_15_2_for_iOS-Debug/ci_scripts, the committed Xcode project, Release),
    # but for the iOS simulator; then starts it there and keeps screenshots and logs
    runs-on: macos-26
    timeout-minutes: 120
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Newest Xcode as /Applications/Xcode.app (the path of the Xcode Cloud scripts)
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          if [ ! -e /Applications/Xcode.app ]; then sudo ln -s "$XCODE" /Applications/Xcode.app; fi
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Xcode Cloud scripts
        run: |
          # what Xcode Cloud gives them: the repository path, also as /Volumes/workspace/repository
          export CI_PRIMARY_REPOSITORY_PATH="$GITHUB_WORKSPACE"
          sudo mkdir -p /Volumes/workspace
          sudo ln -sfn "$GITHUB_WORKSPACE" /Volumes/workspace/repository
          cd build-qdomyos-zwift-Qt_5_15_2_for_iOS-Debug/ci_scripts
          bash ci_post_clone.sh
          bash ci_pre_xcodebuild.sh

      - name: Build for the simulator
        run: |
          bash .github/scripts/build_ios_simulator.sh ios-test/xcodebuild.log

      - name: Start test on the simulator
        run: |
          # the simulator build is x86_64, the runner is Apple Silicon
          softwareupdate --install-rosetta --agree-to-license || true
          sh .github/scripts/ios_simulator_start_test.sh dd

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-test-evidence
          path: ios-test/
          if-no-files-found: warn
