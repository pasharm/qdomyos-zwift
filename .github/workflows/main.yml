# test branch: run an APK that was already built on one emulator and keep logcat and
# screenshots (no build). The source run id is below.
name: CI

on:
  workflow_dispatch:
    inputs:
      source:
        description: run id of the build to test
        required: true
      repo:
        description: repository of that run (cagnulein/qdomyos-zwift for an upstream build)
        required: false
        default: 'pasharm/qdomyos-zwift'
      modern:
        description: ui_modern for the run (false = the classic look, for comparison)
        required: false
        default: 'true'
      log_debug:
        description: log_debug for the run (false = the debug log off)
        required: false
        default: 'true'

jobs:
  emulator-logcat:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # T-318: the patched QtAndroid.jar on old Android (QZ minSdk 21, consoles on 5.1-8.1)
    strategy:
      fail-fast: false
      matrix:
        api: [22, 24, 28]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK from the build run
        uses: actions/download-artifact@v4
        with:
          name: fdroid-android-trial
          path: apk-debug
          run-id: ${{ inputs.source }}
          repository: ${{ inputs.repo }}
          github-token: ${{ github.token }}

      - name: Setup Java for Android Emulator
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Start the app and record logcat
        uses: ReactiveCircus/android-emulator-runner@v2
        env:
          UI_MODERN: ${{ inputs.modern }}
          LOG_DEBUG: ${{ inputs.log_debug }}
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          profile: Nexus 6
          # the APK is 554 MB: on API 22 the default data partition had no room for it
          disk-size: 6000M
          disable-animations: true
          script: bash .github/emu.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat-${{ inputs.source }}-api${{ matrix.api }}
          path: |
            screenshot.png
            *.png
            process_list.txt
            full_logcat.txt
            steps.log
            t318-errors.txt
            dumps/
            qz-logs/
          if-no-files-found: warn
